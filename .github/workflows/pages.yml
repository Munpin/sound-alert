# web/ 폴더만 GitHub Pages로 배포한다.
# main 브랜치에 push하면 자동으로 돈다.
# 올리기(build)와 배포(deploy)를 다른 작업으로 나눈다. 같은 작업에 두면 deploy-pages가
# 방금 올린 묶음을 못 찾는 버그가 있다 (actions/deploy-pages issue #451).
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
